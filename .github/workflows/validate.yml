name: Validate Roblox Project

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - run: rojo --version
      - run: mkdir -p build
      - run: rojo build default.project.json -o build/PlaygroundAwake.rbxl
